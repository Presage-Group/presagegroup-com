name: Build and Deploy
on:
  push:
    branches:
      - main
      - master
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # cache for speed
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            __cache
            ~/.julia
          key: ${{ runner.os }}-franklin-cache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-franklin-cache-
      # install julia
      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      # Build with updated Xranklin
      - run: julia -e '
          using Pkg; Pkg.add(url="https://github.com/tlienart/Xranklin.jl", rev="main");
          using Xranklin; build();'
      - run: touch __site/.nojekyll
      - name: Build and Deploy
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: __site
